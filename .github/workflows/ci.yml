# Platform CI: every PR and push to main. Images are built on PRs and pushed to GHCR from main
# (tag = commit SHA, the same tag is later promoted to stage and prod).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog:
    name: test agents and gateway config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Validate test-agents/
        run: uv run scripts/validate-agents.py test-agents/*/agent.yaml
      - name: Generate gateway config
        env:  # test-agents/ has the catalog layout; throwaway keys: only proves agents turn into valid routes
          CATALOG_DIR: test-agents
          LANGFLOW_RUNTIME_GATEWAY_KEY: ci
          LANGFLOW_BUILDER_GATEWAY_KEY: ci
        run: uv run scripts/gen-gateway.py

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npx eslint
      - run: npx tsc --noEmit
      - run: npm run build

  adapter:
    name: langflow-adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/langflow-adapter
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with-requirements requirements.txt --with pytest pytest -q

  images:
    needs: [catalog, portal, adapter]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - {name: portal, context: apps/portal}
          - {name: langflow-adapter, context: services/langflow-adapter}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/agent-platform-${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
